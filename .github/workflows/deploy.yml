name: Specloom AWS Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: specloom-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  STACK_NAME: specloom
  SAM_TEMPLATE: infra/aws/template.yaml

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
          SPECL00M_ARCHITECT_MODE: showcase
          SPECL00M_RUNTIME_MODE: local
          SPECL00M_STORAGE_MODE: memory
          SPECL00M_ALLOWED_BEDROCK_MODELS: amazon.nova-lite-v1:0
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Validate SAM template
        run: sam validate --template-file "${SAM_TEMPLATE}" --region "${AWS_REGION}"

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: specloom-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Build SAM application
        run: sam build --template-file "${SAM_TEMPLATE}" --use-container

      - name: Deploy SAM application
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          # Pick up the fallback keys by name so a slightly different secret name still works.
          # Only secret names are printed; values stay masked.
          pick() { printf '%s' "${ALL_SECRETS}" | jq -r --arg re "$1" '[to_entries[] | select(.key != "github_token") | select(.key | test($re; "i")) | select(.value | length > 0)] | first | .key // empty'; }
          value() { printf '%s' "${ALL_SECRETS}" | jq -r --arg k "$1" '.[$k] // empty'; }
          GEMINI_NAME="$(pick '^FALLBACK_LLM_API_KEY$')"
          [ -n "${GEMINI_NAME}" ] || GEMINI_NAME="$(pick 'gemini|google')"
          GROQ_NAME="$(pick 'groq')"
          echo "Fallback secrets found: gemini=${GEMINI_NAME:-none} groq=${GROQ_NAME:-none}"
          FALLBACK_LLM_OVERRIDE=""
          NAMES=""
          if [ -n "${GEMINI_NAME}" ]; then
            FALLBACK_LLM_OVERRIDE="FallbackLlmApiKey=$(value "${GEMINI_NAME}")"
            NAMES="gemini:${GEMINI_NAME}"
          fi
          if [ -n "${GROQ_NAME}" ]; then
            FALLBACK_LLM_OVERRIDE="${FALLBACK_LLM_OVERRIDE} GroqApiKey=$(value "${GROQ_NAME}")"
            NAMES="${NAMES:+${NAMES};}groq:${GROQ_NAME}"
          fi
          CF_ACCOUNT_NAME="$(pick 'cloudflare.*account|cf_account')"
          CF_TOKEN_NAME="$(pick 'cloudflare.*(token|key)|cf_api_token')"
          echo "Cloudflare secrets found: account=${CF_ACCOUNT_NAME:-none} token=${CF_TOKEN_NAME:-none}"
          if [ -n "${CF_ACCOUNT_NAME}" ] && [ -n "${CF_TOKEN_NAME}" ]; then
            FALLBACK_LLM_OVERRIDE="${FALLBACK_LLM_OVERRIDE} CloudflareAccountId=$(value "${CF_ACCOUNT_NAME}") CloudflareApiToken=$(value "${CF_TOKEN_NAME}")"
            NAMES="${NAMES:+${NAMES};}cloudflare:${CF_ACCOUNT_NAME}+${CF_TOKEN_NAME}"
          fi
          FALLBACK_LLM_OVERRIDE="${FALLBACK_LLM_OVERRIDE} FallbackSecretNames=${NAMES:-none}"
          sam deploy \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              AuthMode=off \
              ArchitectMode=bedrock \
              ReviewMode=none \
              ContextMode=bedrock \
              RuntimeMode=stepfunctions \
              BedrockModelId=apac.amazon.nova-pro-v1:0 \
              BedrockFallbackModelId=apac.amazon.nova-pro-v1:0 \
              AllowedBedrockModels=apac.amazon.nova-pro-v1:0,amazon.nova-pro-v1:0,apac.amazon.nova-micro-v1:0,amazon.nova-micro-v1:0,apac.amazon.nova-lite-v1:0,amazon.nova-lite-v1:0 \
              ${FALLBACK_LLM_OVERRIDE} \
            --template-file .aws-sam/build/template.yaml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Verify deployed Bedrock configuration
        run: |
          echo "CloudFormation Bedrock parameters:"
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Parameters' \
            --output table

      - name: Verify deployed API
        run: |
          API_URL="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)"
          API_URL="${API_URL%/}"
          echo "API_URL=${API_URL}" >> "${GITHUB_ENV}"
          echo "Checking ${API_URL}/health"
          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS="$(curl \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            --output "${RESPONSE_FILE}" \
            --write-out "%{http_code}" \
            "${API_URL}/health")"
          echo "HTTP_STATUS=${HTTP_STATUS}"
          echo "RESPONSE:"
          cat "${RESPONSE_FILE}"
          echo
          test "${HTTP_STATUS}" = "200"
          echo "Specloom API is healthy: ${API_URL}/health"


      - name: One-shot project cleanup
        if: hashFiles('ops/cleanup-projects.txt') != ''
        run: |
          TABLE="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='ProjectsTableName'].OutputValue" --output text)"
          BUCKET="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='SourcesBucketName'].OutputValue" --output text)"
          grep -v '^[[:space:]]*#' ops/cleanup-projects.txt | sed '/^[[:space:]]*$/d' | while read -r PROJECT; do
            case "${PROJECT}" in *[!a-z0-9-]*) echo "Skipping invalid id: ${PROJECT}"; continue;; esac
            echo "Deleting project ${PROJECT}"
            aws dynamodb delete-item --table-name "${TABLE}" --key "{\"project_id\": {\"S\": \"${PROJECT}\"}}"
            aws s3 rm "s3://${BUCKET}/projects/${PROJECT}/" --recursive --only-show-errors
          done

      - name: Print deployment outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs' \
            --output table
