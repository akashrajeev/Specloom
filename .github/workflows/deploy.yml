name: Specloom AWS Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: specloom-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  STACK_NAME: specloom
  SAM_TEMPLATE: infra/aws/template.yaml

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
          SPECL00M_ARCHITECT_MODE: showcase
          SPECL00M_RUNTIME_MODE: local
          SPECL00M_STORAGE_MODE: memory
          SPECL00M_ALLOWED_BEDROCK_MODELS: amazon.nova-lite-v1:0
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Validate SAM template
        run: sam validate --template-file "${SAM_TEMPLATE}" --region "${AWS_REGION}"

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: specloom-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Build SAM application
        run: sam build --template-file "${SAM_TEMPLATE}" --use-container

      - name: Deploy SAM application
        run: |
          sam deploy \
            --config-file samconfig.toml \
            --template-file .aws-sam/build/template.yaml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Verify deployed API
        run: |
          API_URL="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)"
          echo "API_URL=${API_URL}" >> "${GITHUB_ENV}"
          curl --fail --silent --show-error "${API_URL}health"
          echo "Specloom API is healthy: ${API_URL}"

      - name: Print deployment outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs' \
            --output table
