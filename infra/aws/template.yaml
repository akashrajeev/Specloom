AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Specloom Ship It control plane

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Runtime: python3.11
    Environment:
      Variables:
        SPECL00M_STORAGE_MODE: aws
        SPECL00M_DDB_TABLE: !Ref ProjectsTable
        SPECL00M_S3_BUCKET: !Ref SourcesBucket
        SPECL00M_CORS_ORIGINS: !Ref CorsOrigins
        SPECL00M_ARCHITECT_MODE: !Ref ArchitectMode
        SPECL00M_RUNTIME_MODE: !Ref RuntimeMode
        SPECL00M_BEDROCK_MODEL_ID: !Ref BedrockModelId
        SPECL00M_SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName

Parameters:
  CorsOrigins:
    Type: String
    Default: "*"
  ArchitectMode:
    Type: String
    Default: bedrock
    AllowedValues: [showcase, bedrock]
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
  RuntimeMode:
    Type: String
    Default: local
    AllowedValues: [local, sagemaker, bedrock]
  SageMakerEndpointName:
    Type: String
    Default: ""
  ScheduleExpression:
    Type: String
    Default: "rate(1 day)"

Resources:
  SpecloomApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../..
      Handler: backend.lambda_handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - S3CrudPolicy:
            BucketName: !Ref SourcesBucket
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
            - Effect: Allow
              Action:
                - sagemaker:InvokeEndpoint
              Resource: "*"
      Events:
        Root:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

  DailyRun:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt SpecloomApi.Arn
          Id: DailyRunTarget
          Input: |
            {
              "source": "aws.events",
              "detail": {
                "project_id": "researchhunter",
                "input_data": {}
              }
            }

  AllowEventBridgeInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SpecloomApi
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyRun.Arn

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: project_id
          AttributeType: S
      KeySchema:
        - AttributeName: project_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  SourcesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Description: Specloom API URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  ProjectsTableName:
    Value: !Ref ProjectsTable
  SourcesBucketName:
    Value: !Ref SourcesBucket
