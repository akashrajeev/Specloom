AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Specloom Ship It control plane

Globals:
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
  Function:
    Timeout: 900
    MemorySize: 1536
    Runtime: python3.11
    Environment:
      Variables:
        SPECL00M_STORAGE_MODE: aws
        SPECL00M_AUTH_MODE: !Ref AuthMode
        SPECL00M_COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
        SPECL00M_COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
        SPECL00M_DDB_TABLE: !Ref ProjectsTable
        SPECL00M_S3_BUCKET: !Ref SourcesBucket
        SPECL00M_APPROVALS_TABLE: !Ref ApprovalsTable
        SPECL00M_BUILD_JOBS_TABLE: !Ref BuildJobsTable
        SPECL00M_CORS_ORIGINS: !Ref CorsOrigins
        SPECL00M_ARCHITECT_MODE: !Ref ArchitectMode
        SPECL00M_REVIEW_MODE: !Ref ReviewMode
        SPECL00M_CONTEXT_MODE: !Ref ContextMode
        SPECL00M_RUNTIME_MODE: !Ref RuntimeMode
        SPECL00M_BEDROCK_MODEL_ID: !Ref BedrockModelId
        SPECL00M_BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelId
        SPECL00M_NOVA_LITE_PROFILE: apac.amazon.nova-lite-v1:0
        SPECL00M_NOVA_MICRO_PROFILE: apac.amazon.nova-micro-v1:0
        SPECL00M_ALLOWED_BEDROCK_MODELS: !Ref AllowedBedrockModels
        SPECL00M_SYSTEM_PLANNER_MODE: deterministic
        SPECL00M_SAGEMAKER_ENDPOINT_NAME: !Ref SageMakerEndpointName
        SPECL00M_STEP_FUNCTIONS_ROLE_ARN: !GetAtt DurableStateMachineRole.Arn
        SPECL00M_STEP_FUNCTIONS_WORKER_ARN: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:specloom-${AWS::StackName}-api"
        SPECL00M_STEP_FUNCTIONS_APPROVAL_ARN: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:specloom-${AWS::StackName}-api"

Parameters:
  CorsOrigins:
    Type: String
    Default: "*"
  AuthMode:
    Type: String
    Default: "cognito"
    AllowedValues: ["off", "cognito"]
  ArchitectMode:
    Type: String
    Default: bedrock
    AllowedValues: [showcase, bedrock]
  ReviewMode:
    Type: String
    Default: none
    AllowedValues: [none, bedrock]
  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-micro-v1:0
  BedrockFallbackModelId:
    Type: String
    Default: apac.amazon.nova-micro-v1:0
  AllowedBedrockModels:
    Type: String
    Default: "apac.amazon.nova-micro-v1:0,amazon.nova-micro-v1:0,apac.amazon.nova-lite-v1:0,amazon.nova-lite-v1:0"
  ContextMode:
    Type: String
    Default: deterministic
    AllowedValues: [deterministic, bedrock]
  RuntimeMode:
    Type: String
    Default: stepfunctions
    AllowedValues: [local, sagemaker, bedrock, stepfunctions]
  SageMakerEndpointName:
    Type: String
    Default: ""
  ScheduleExpression:
    Type: String
    Default: "rate(1 day)"

Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "specloom-${AWS::StackName}"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: workspace_id
          AttributeDataType: String
          Mutable: false
          Required: false
          DeveloperOnlyAttribute: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "specloom-${AWS::StackName}-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  SpecloomApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "specloom-${AWS::StackName}-api"
      CodeUri: ../..
      Handler: backend.lambda_handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApprovalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BuildJobsTable
        - S3CrudPolicy:
            BucketName: !Ref SourcesBucket
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
            - Effect: Allow
              Action:
                - sagemaker:InvokeEndpoint
              Resource: "*"
            - Effect: Allow
              Action:
                - states:CreateStateMachine
                - states:UpdateStateMachine
                - states:StartExecution
                - states:DescribeExecution
                - states:SendTaskSuccess
                - states:SendTaskFailure
                - states:ValidateStateMachineDefinition
              Resource: "*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt DurableStateMachineRole.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:specloom-${AWS::StackName}-api"
      Events:
        Root:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

  DurableStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSpecloomWorker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:specloom-${AWS::StackName}-api"

  DailyRun:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt SpecloomApi.Arn
          Id: DailyRunTarget
          Input: |
            {
              "source": "aws.events",
              "detail": {
                "project_id": "researchhunter",
                "input_data": {}
              }
            }

  AllowEventBridgeInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SpecloomApi.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyRun.Arn

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: project_id
          AttributeType: S
      KeySchema:
        - AttributeName: project_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ApprovalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: approval_id
          AttributeType: S
        - AttributeName: project_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: approval_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ProjectStatusIndex
          KeySchema:
            - AttributeName: project_id
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  BuildJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: project_id
          AttributeType: S
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: project_id
          KeyType: HASH
        - AttributeName: run_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  SourcesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Description: Specloom API URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  ProjectsTableName:
    Value: !Ref ProjectsTable
  ApprovalsTableName:
    Value: !Ref ApprovalsTable
  BuildJobsTableName:
    Value: !Ref BuildJobsTable
  SourcesBucketName:
    Value: !Ref SourcesBucket
  DurableStateMachineRoleArn:
    Value: !GetAtt DurableStateMachineRole.Arn
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
  CognitoIssuer:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
