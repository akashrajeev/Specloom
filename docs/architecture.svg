<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Specloom — End-to-End Architecture</title>
  <desc id="desc">Infographic-style architecture showing experience, the Specloom control plane, secure execution, output, and AWS infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061c31"/><stop offset="1" stop-color="#031420"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1e2"/><stop offset="1" stop-color="#ffd1a4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".24"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#071421"/>
    </marker>
    <marker id="whiteArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#d9f7ff"/>
    </marker>
    <style>
      .title{font:700 31px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .subtitle{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#c9edf6}
      .tag{font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#59cfe9;letter-spacing:2px}
      .panel{fill:url(#peach);stroke:#12b5da;stroke-width:2.5}
      .header{fill:#075b77}
      .headerText{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#fff;text-anchor:middle}
      .headerSub{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#d8f6fb;text-anchor:middle}
      .card{fill:#fff4e9;stroke:#e7bb92;stroke-width:1.3}
      .cardStrong{fill:#fff9f2;stroke:#173b55;stroke-width:2}
      .cardTitle{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#0a2d45}
      .cardBody{font:400 10.5px Inter,Segoe UI,Arial,sans-serif;fill:#2a4d60}
      .chip{fill:#0a6482}
      .chipText{font:700 10px Inter,Segoe UI,Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .infra{fill:#075b77;stroke:#12b5da;stroke-width:2.5}
      .infraTitle{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .infraSub{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#d8f6fb}
      .infraCard{fill:#fff4e9;stroke:#e7bb92;stroke-width:1.2}
      .infraName{font:700 10.5px Inter,Segoe UI,Arial,sans-serif;fill:#0a2d45}
      .infraBody{font:400 9px Inter,Segoe UI,Arial,sans-serif;fill:#2a4d60}
      .arrow{stroke:#071421;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .whiteArrow{stroke:#d9f7ff;stroke-width:2;fill:none;marker-end:url(#whiteArrow)}
      .dep{stroke:#bfeaf5;stroke-width:1.8;fill:none;stroke-dasharray:6 6}
      .depLabel{font:600 10px Inter,Segoe UI,Arial,sans-serif;fill:#d8f6fb;text-anchor:middle}
    </style>
  </defs>

  <rect width="1600" height="860" rx="24" fill="url(#bg)"/>
  <text x="50" y="47" class="title">Specloom — End-to-End Architecture</text>
  <text x="50" y="72" class="subtitle">Problem + context → Workflow IR → deterministic policy boundary → runtime → observable output.</text>
  <text x="50" y="101" class="tag">SPECIFY</text>
  <text x="126" y="101" class="tag">COMPILE</text>
  <text x="205" y="101" class="tag">EXECUTE</text>
  <text x="294" y="101" class="tag">EVOLVE</text>

  <!-- EXPERIENCE -->
  <g filter="url(#shadow)">
    <rect x="35" y="125" width="250" height="560" rx="14" class="panel"/>
    <rect x="35" y="125" width="250" height="68" rx="14" class="header"/>
    <rect x="35" y="163" width="250" height="30" class="header"/>
    <text x="160" y="156" class="headerText">EXPERIENCE</text>
    <text x="160" y="177" class="headerSub">User interface and operations</text>

    <rect x="53" y="215" width="214" height="125" rx="11" class="cardStrong"/>
    <text x="120" y="252" class="cardTitle">User</text>
    <text x="120" y="271" class="cardBody">Define goals and</text>
    <text x="120" y="286" class="cardBody">provide context</text>
    <circle cx="82" cy="266" r="18" fill="#0c5372"/>
    <circle cx="82" cy="259" r="7" fill="#fff"/>
    <path d="M70 281 q12 -16 24 0" fill="#fff"/>

    <rect x="53" y="368" width="214" height="125" rx="11" class="card"/>
    <text x="120" y="405" class="cardTitle">React / Vite Workspace</text>
    <text x="120" y="427" class="cardBody">Build, visualize and</text>
    <text x="120" y="443" class="cardBody">manage systems</text>
    <rect x="71" y="457" width="31" height="19" rx="3" fill="#0c5372"/>
    <rect x="75" y="461" width="23" height="11" fill="#fff"/>
    <path d="M68 480 h37" stroke="#0c5372" stroke-width="3"/>

    <rect x="53" y="521" width="214" height="110" rx="11" class="card"/>
    <text x="120" y="557" class="cardTitle">Operations</text>
    <text x="120" y="577" class="cardBody">Deploy · approvals · runs</text>
    <circle cx="82" cy="603" r="18" fill="#0c5372"/>
    <circle cx="82" cy="603" r="7" fill="#fff"/>
  </g>
  <path d="M160 340 V368" class="arrow"/>
  <path d="M160 493 V521" class="arrow"/>

  <!-- CONTROL PLANE -->
  <g filter="url(#shadow)">
    <rect x="310" y="125" width="620" height="560" rx="14" class="panel"/>
    <rect x="310" y="125" width="620" height="68" rx="14" class="header"/>
    <rect x="310" y="163" width="620" height="30" class="header"/>
    <text x="620" y="156" class="headerText">SPECLOOM CONTROL PLANE</text>
    <text x="620" y="177" class="headerSub">From problem to validated Workflow IR</text>

    <rect x="330" y="215" width="137" height="130" rx="11" class="card"/>
    <rect x="482" y="215" width="137" height="130" rx="11" class="card"/>
    <rect x="634" y="215" width="137" height="130" rx="11" class="card"/>
    <rect x="786" y="215" width="124" height="130" rx="11" class="card"/>

    <text x="398.5" y="254" class="cardTitle" text-anchor="middle">FastAPI API</text>
    <text x="398.5" y="276" class="cardBody" text-anchor="middle">Ingestion</text>
    <text x="398.5" y="291" class="cardBody" text-anchor="middle">orchestration</text>
    <text x="398.5" y="306" class="cardBody" text-anchor="middle">workspace APIs</text>

    <text x="550.5" y="250" class="cardTitle" text-anchor="middle">Context Graph</text>
    <text x="550.5" y="276" class="cardBody" text-anchor="middle">Sources + facts</text>
    <text x="550.5" y="291" class="cardBody" text-anchor="middle">entities + tools</text>
    <text x="550.5" y="306" class="cardBody" text-anchor="middle">provenance</text>

    <text x="702.5" y="250" class="cardTitle" text-anchor="middle">Gap Detection</text>
    <text x="702.5" y="276" class="cardBody" text-anchor="middle">Find missing</text>
    <text x="702.5" y="291" class="cardBody" text-anchor="middle">information and</text>
    <text x="702.5" y="306" class="cardBody" text-anchor="middle">capabilities</text>

    <text x="848" y="247" class="cardTitle" text-anchor="middle">Problem</text>
    <text x="848" y="264" class="cardTitle" text-anchor="middle">Decomposition</text>
    <text x="848" y="289" class="cardBody" text-anchor="middle">Break down</text>
    <text x="848" y="304" class="cardBody" text-anchor="middle">into executable</text>
    <text x="848" y="319" class="cardBody" text-anchor="middle">tasks</text>

    <path d="M467 280 H482" class="arrow"/><path d="M619 280 H634" class="arrow"/><path d="M771 280 H786" class="arrow"/>
    <path d="M848 345 C848 365 398 365 398 385" class="arrow"/>

    <rect x="330" y="385" width="137" height="140" rx="11" class="card"/>
    <rect x="482" y="385" width="137" height="140" rx="11" class="card"/>
    <rect x="634" y="385" width="137" height="140" rx="11" class="cardStrong"/>
    <rect x="786" y="385" width="124" height="140" rx="11" class="card"/>

    <text x="398.5" y="424" class="cardTitle" text-anchor="middle">Architect</text>
    <text x="398.5" y="451" class="cardBody" text-anchor="middle">Plan system and</text>
    <text x="398.5" y="467" class="cardBody" text-anchor="middle">select capabilities</text>

    <text x="550.5" y="420" class="cardTitle" text-anchor="middle">Universal Compiler</text>
    <text x="550.5" y="448" class="cardBody" text-anchor="middle">Generate SoftwareSpec</text>
    <text x="550.5" y="464" class="cardBody" text-anchor="middle">and executable</text>
    <text x="550.5" y="480" class="cardBody" text-anchor="middle">Workflow IR</text>

    <text x="702.5" y="424" class="cardTitle" text-anchor="middle">Workflow IR</text>
    <text x="702.5" y="451" class="cardBody" text-anchor="middle">Typed, verifiable</text>
    <text x="702.5" y="467" class="cardBody" text-anchor="middle">canonical execution</text>
    <text x="702.5" y="483" class="cardBody" text-anchor="middle">representation</text>

    <text x="848" y="418" class="cardTitle" text-anchor="middle">Validation +</text>
    <text x="848" y="435" class="cardTitle" text-anchor="middle">Policy</text>
    <text x="848" y="460" class="cardBody" text-anchor="middle">structure,</text>
    <text x="848" y="476" class="cardBody" text-anchor="middle">coverage and</text>
    <text x="848" y="492" class="cardBody" text-anchor="middle">permissions</text>

    <path d="M467 452 H482" class="arrow"/><path d="M619 452 H634" class="arrow"/><path d="M771 452 H786" class="arrow"/>

    <rect x="330" y="555" width="580" height="95" rx="11" class="card"/>
    <text x="620" y="586" class="cardTitle" text-anchor="middle">Evaluation + Bounded Repair</text>
    <text x="620" y="610" class="cardBody" text-anchor="middle">Evaluate requirements and evidence; repair only within bounded IR/configuration rules.</text>
    <rect x="505" y="621" width="88" height="20" rx="10" class="chip"/><text x="549" y="631" class="chipText">EVALUATE</text>
    <rect x="600" y="621" width="78" height="20" rx="10" class="chip"/><text x="639" y="631" class="chipText">REPAIR</text>
  </g>
  <path d="M848 525 V555" class="arrow"/>

  <!-- EXECUTION -->
  <g filter="url(#shadow)">
    <rect x="950" y="125" width="300" height="560" rx="14" class="panel"/>
    <rect x="950" y="125" width="300" height="68" rx="14" class="header"/>
    <rect x="950" y="163" width="300" height="30" class="header"/>
    <text x="1100" y="156" class="headerText">EXECUTION PLANE</text>
    <text x="1100" y="177" class="headerSub">Secure, policy-aware runtime execution</text>

    <rect x="970" y="215" width="260" height="82" rx="11" class="cardStrong"/>
    <text x="1040" y="247" class="cardTitle">Runtime</text>
    <text x="1040" y="266" class="cardBody">Execute Workflow IR</text>
    <text x="1040" y="281" class="cardBody">with policy enforcement</text>
    <circle cx="1000" cy="255" r="19" fill="#0c5372"/>
    <path d="M995 244 l13 11 -13 11 z" fill="#fff"/>

    <rect x="970" y="317" width="260" height="150" rx="11" class="card"/>
    <text x="1100" y="349" class="cardTitle" text-anchor="middle">Policy-aware Tool Gateway</text>
    <text x="1100" y="370" class="cardBody" text-anchor="middle">Controlled access to external tools</text>
    <text x="1100" y="386" class="cardBody" text-anchor="middle">and services</text>
    <rect x="990" y="405" width="220" height="45" rx="9" fill="#eaf8fc" stroke="#4cbfdc" stroke-width="1.3"/>
    <text x="1100" y="423" class="cardTitle" text-anchor="middle">CAPABILITIES</text>
    <rect x="1000" y="431" width="43" height="17" rx="8" class="chip"/><text x="1021.5" y="439.5" class="chipText">Web</text>
    <rect x="1050" y="431" width="43" height="17" rx="8" class="chip"/><text x="1071.5" y="439.5" class="chipText">URL</text>
    <rect x="1100" y="431" width="54" height="17" rx="8" class="chip"/><text x="1127" y="439.5" class="chipText">GitHub</text>
    <rect x="1161" y="431" width="43" height="17" rx="8" class="chip"/><text x="1182.5" y="439.5" class="chipText">API</text>

    <rect x="970" y="487" width="260" height="82" rx="11" class="card"/>
    <text x="1040" y="518" class="cardTitle">Human Approval</text>
    <text x="1040" y="538" class="cardBody">Approval for sensitive</text>
    <text x="1040" y="553" class="cardBody">side-effecting actions</text>

    <rect x="970" y="589" width="260" height="72" rx="11" class="card"/>
    <text x="1040" y="618" class="cardTitle">Execution Trace + Output</text>
    <text x="1040" y="638" class="cardBody">Logs, artifacts, status, results</text>
  </g>
  <path d="M910 452 H950" class="arrow"/>
  <path d="M1100 297 V317" class="arrow"/><path d="M1100 467 V487" class="arrow"/><path d="M1100 569 V589" class="arrow"/>

  <!-- OUTPUT -->
  <g filter="url(#shadow)">
    <rect x="1270" y="125" width="295" height="560" rx="14" class="panel"/>
    <rect x="1270" y="125" width="295" height="68" rx="14" class="header"/>
    <rect x="1270" y="163" width="295" height="30" class="header"/>
    <text x="1417.5" y="156" class="headerText">OUTPUT</text>
    <text x="1417.5" y="177" class="headerSub">Observable system results</text>

    <rect x="1290" y="215" width="255" height="94" rx="11" class="cardStrong"/>
    <text x="1358" y="248" class="cardTitle">Completed Execution</text>
    <text x="1358" y="268" class="cardBody">Tasks executed successfully</text>

    <rect x="1290" y="327" width="255" height="94" rx="11" class="card"/>
    <text x="1358" y="360" class="cardTitle">Artifacts</text>
    <text x="1358" y="380" class="cardBody">Generated files, reports and data</text>

    <rect x="1290" y="439" width="255" height="94" rx="11" class="card"/>
    <text x="1358" y="472" class="cardTitle">Logs &amp; Trace</text>
    <text x="1358" y="492" class="cardBody">Observable and auditable execution history</text>

    <rect x="1290" y="551" width="255" height="94" rx="11" class="card"/>
    <text x="1358" y="584" class="cardTitle">Real-world Results</text>
    <text x="1358" y="604" class="cardBody">Delivered outcomes from the compiled system</text>
  </g>
  <path d="M1250 252 H1270" class="arrow"/>
  <path d="M1417.5 309 V327" class="arrow"/><path d="M1417.5 421 V439" class="arrow"/><path d="M1417.5 533 V551" class="arrow"/>

  <!-- FLOW EMPHASIS -->
  <path d="M285 280 H310" class="whiteArrow"/>
  <path d="M930 280 H950" class="whiteArrow"/>
  <path d="M1250 280 H1270" class="whiteArrow"/>

  <!-- AWS -->
  <g filter="url(#shadow)">
    <rect x="35" y="715" width="1530" height="105" rx="14" class="infra"/>
    <text x="58" y="746" class="infraTitle">AWS INFRASTRUCTURE</text>
    <text x="285" y="746" class="infraSub">Scalable, secure and managed cloud foundation</text>

    <rect x="50" y="765" width="175" height="42" rx="9" class="infraCard"/>
    <text x="65" y="783" class="infraName">API Gateway + Lambda</text>
    <text x="65" y="798" class="infraBody">Ingress + FastAPI</text>

    <rect x="235" y="765" width="175" height="42" rx="9" class="infraCard"/>
    <text x="250" y="783" class="infraName">Cognito</text>
    <text x="250" y="798" class="infraBody">Identity + workspace</text>

    <rect x="420" y="765" width="175" height="42" rx="9" class="infraCard"/>
    <text x="435" y="783" class="infraName">Amazon Bedrock</text>
    <text x="435" y="798" class="infraBody">Architect + agent models</text>

    <rect x="605" y="765" width="175" height="42" rx="9" class="infraCard"/>
    <text x="620" y="783" class="infraName">Step Functions</text>
    <text x="620" y="798" class="infraBody">Durable workflows</text>

    <rect x="790" y="765" width="175" height="42" rx="9" class="infraCard"/>
    <text x="805" y="783" class="infraName">DynamoDB</text>
    <text x="805" y="798" class="infraBody">Project + approvals</text>

    <rect x="975" y="765" width="175" height="42" rx="9" class="infraCard"/>
    <text x="990" y="783" class="infraName">S3</text>
    <text x="990" y="798" class="infraBody">Sources + artifacts</text>

    <rect x="1160" y="765" width="175" height="42" rx="9" class="infraCard"/>
    <text x="1175" y="783" class="infraName">EventBridge</text>
    <text x="1175" y="798" class="infraBody">Scheduled triggers</text>

    <rect x="1345" y="765" width="205" height="42" rx="9" class="infraCard"/>
    <text x="1360" y="783" class="infraName">IAM + Service Permissions</text>
    <text x="1360" y="798" class="infraBody">Scoped service access</text>
  </g>

  <!-- Infrastructure dependencies -->
  <path d="M160 685 V715" class="dep"/><path d="M620 685 V715" class="dep"/>
  <path d="M1100 685 V715" class="dep"/><path d="M1417 685 V715" class="dep"/>
  <text x="160" y="705" class="depLabel">API / CONTROL</text>
  <text x="620" y="705" class="depLabel">MODEL + DATA</text>
  <text x="1100" y="705" class="depLabel">DURABLE EXECUTION</text>
  <text x="1417" y="705" class="depLabel">STORAGE / EVENTS</text>

  <text x="35" y="845" class="tag">SPECLOOM</text>
  <text x="800" y="845" class="tag" text-anchor="middle">TURN ANY PROBLEM INTO A PRODUCTION-READY AGENTIC SYSTEM</text>
</svg>