<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Specloom — End-to-End Architecture</title>
  <desc id="desc">Specloom architecture in an infographic style: experience, control plane, execution plane, output, and AWS infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071b2e"/><stop offset="1" stop-color="#041421"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0df"/><stop offset="1" stop-color="#ffd6ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#07111c"/>
    </marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#bfe9f7}
      .plane{fill:url(#peach);stroke:#00b8e6;stroke-width:2.5}
      .head{fill:#075b77}
      .headText{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .headSub{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#d4f4fb}
      .card{fill:#fff3e7;stroke:#e7b98c;stroke-width:1.5}
      .cardStrong{fill:#fffaf4;stroke:#12344d;stroke-width:2}
      .cardTitle{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#0a2a40}
      .cardBody{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#24475c}
      .chip{fill:#0b6482}
      .chipText{font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .infra{fill:#075b77;stroke:#00b8e6;stroke-width:2.5}
      .infraTitle{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .infraSub{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#cfeef6}
      .infraCard{fill:#fff3e7;stroke:#e7b98c;stroke-width:1.5}
      .infraName{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#0a2a40}
      .infraBody{font:400 10px Inter,Segoe UI,Arial,sans-serif;fill:#24475c}
      .arrow{stroke:#07111c;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#c8f2ff;stroke-width:2;fill:none;stroke-dasharray:7 7}
      .label{font:600 11px Inter,Segoe UI,Arial,sans-serif;fill:#d4f4fb;text-anchor:middle}
      .foot{font:600 11px Inter,Segoe UI,Arial,sans-serif;fill:#54cee8;letter-spacing:2px}
    </style>
  </defs>

  <rect width="1800" height="1000" rx="26" fill="url(#bg)"/>
  <text x="65" y="62" class="title">Specloom — End-to-End Architecture</text>
  <text x="65" y="92" class="subtitle">Problem + context → Workflow IR → deterministic policy boundary → runtime → observable output.</text>

  <!-- left utility -->
  <text x="70" y="135" class="foot">SPECIFY</text>
  <text x="70" y="151" class="foot">COMPILE</text>
  <text x="70" y="167" class="foot">EXECUTE</text>
  <text x="70" y="183" class="foot">EVOLVE</text>

  <!-- EXPERIENCE -->
  <g filter="url(#shadow)">
    <rect x="45" y="125" width="275" height="660" rx="14" class="plane"/>
    <rect x="45" y="125" width="275" height="70" rx="14" class="head"/>
    <rect x="45" y="165" width="275" height="30" class="head"/>
    <text x="182.5" y="157" class="headText" text-anchor="middle">EXPERIENCE</text>
    <text x="182.5" y="179" class="headSub" text-anchor="middle">User interface and operations</text>

    <rect x="65" y="220" width="235" height="130" rx="12" class="cardStrong"/>
    <text x="87" y="255" class="cardTitle">User</text>
    <text x="87" y="276" class="cardBody">Define goals and provide context</text>
    <circle cx="88" cy="305" r="20" fill="#0c5372"/>
    <circle cx="88" cy="295" r="8" fill="#fff"/>
    <path d="M72 320 q16 -18 32 0" fill="#fff"/>
    
    <rect x="65" y="380" width="235" height="130" rx="12" class="card"/>
    <text x="87" y="416" class="cardTitle">React / Vite Workspace</text>
    <text x="87" y="438" class="cardBody">Build, visualize and manage systems</text>
    <rect x="82" y="463" width="36" height="22" rx="3" fill="#0c5372"/>
    <rect x="86" y="467" width="28" height="14" fill="#fff"/>
    <path d="M79 490 h42" stroke="#0c5372" stroke-width="4"/>

    <rect x="65" y="540" width="235" height="130" rx="12" class="card"/>
    <text x="87" y="576" class="cardTitle">Operations</text>
    <text x="87" y="598" class="cardBody">Deploy · approvals · runs</text>
    <circle cx="100" cy="628" r="23" fill="#0c5372"/>
    <circle cx="100" cy="628" r="9" fill="#fff"/>
    <path d="M100 604 v594 M100 662 v652 M76 628 H66 M134 628 h-10" stroke="#0c5372" stroke-width="5"/>
  </g>

  <path d="M182.5 350 V380" class="arrow"/>
  <path d="M182.5 510 V540" class="arrow"/>

  <!-- CONTROL PLANE -->
  <g filter="url(#shadow)">
    <rect x="350" y="125" width="625" height="660" rx="14" class="plane"/>
    <rect x="350" y="125" width="625" height="70" rx="14" class="head"/>
    <rect x="350" y="165" width="625" height="30" class="head"/>
    <text x="662.5" y="157" class="headText" text-anchor="middle">SPECLOOM CONTROL PLANE</text>
    <text x="662.5" y="179" class="headSub" text-anchor="middle">From problem to validated Workflow IR</text>

    <!-- row 1 -->
    <rect x="372" y="220" width="135" height="135" rx="12" class="card"/>
    <text x="439.5" y="260" class="cardTitle" text-anchor="middle">FastAPI API</text>
    <text x="439.5" y="283" class="cardBody" text-anchor="middle">Ingestion</text>
    <text x="439.5" y="299" class="cardBody" text-anchor="middle">orchestration</text>
    <text x="439.5" y="315" class="cardBody" text-anchor="middle">workspace APIs</text>
    <rect x="421" y="236" width="37" height="8" rx="4" fill="#0b6482"/>

    <rect x="522" y="220" width="135" height="135" rx="12" class="card"/>
    <text x="589.5" y="260" class="cardTitle" text-anchor="middle">Context Graph</text>
    <text x="589.5" y="283" class="cardBody" text-anchor="middle">Unify context</text>
    <text x="589.5" y="299" class="cardBody" text-anchor="middle">(sources, facts,</text>
    <text x="589.5" y="315" class="cardBody" text-anchor="middle">systems)</text>

    <rect x="672" y="220" width="135" height="135" rx="12" class="card"/>
    <text x="739.5" y="260" class="cardTitle" text-anchor="middle">Gap Detection</text>
    <text x="739.5" y="283" class="cardBody" text-anchor="middle">Find missing</text>
    <text x="739.5" y="299" class="cardBody" text-anchor="middle">information</text>
    <text x="739.5" y="315" class="cardBody" text-anchor="middle">and capabilities</text>

    <rect x="822" y="220" width="130" height="135" rx="12" class="card"/>
    <text x="887" y="257" class="cardTitle" text-anchor="middle">Problem</text>
    <text x="887" y="274" class="cardTitle" text-anchor="middle">Decomposition</text>
    <text x="887" y="299" class="cardBody" text-anchor="middle">Break down</text>
    <text x="887" y="315" class="cardBody" text-anchor="middle">into tasks</text>
    <text x="887" y="331" class="cardBody" text-anchor="middle">and components</text>

    <path d="M507 288 H522" class="arrow"/><path d="M657 288 H672" class="arrow"/><path d="M807 288 H822" class="arrow"/>

    <!-- row 2 -->
    <rect x="372" y="410" width="135" height="145" rx="12" class="card"/>
    <text x="439.5" y="450" class="cardTitle" text-anchor="middle">Architect</text>
    <text x="439.5" y="476" class="cardBody" text-anchor="middle">Plan system</text>
    <text x="439.5" y="492" class="cardBody" text-anchor="middle">and select</text>
    <text x="439.5" y="508" class="cardBody" text-anchor="middle">capabilities</text>

    <rect x="522" y="410" width="135" height="145" rx="12" class="card"/>
    <text x="589.5" y="450" class="cardTitle" text-anchor="middle">Universal</text>
    <text x="589.5" y="467" class="cardTitle" text-anchor="middle">Compiler</text>
    <text x="589.5" y="492" class="cardBody" text-anchor="middle">Generate</text>
    <text x="589.5" y="508" class="cardBody" text-anchor="middle">executable</text>
    <text x="589.5" y="524" class="cardBody" text-anchor="middle">Workflow IR</text>

    <rect x="672" y="410" width="135" height="145" rx="12" class="cardStrong"/>
    <text x="739.5" y="450" class="cardTitle" text-anchor="middle">Workflow IR</text>
    <text x="739.5" y="479" class="cardBody" text-anchor="middle">Typed, verifiable</text>
    <text x="739.5" y="495" class="cardBody" text-anchor="middle">workflow</text>
    <text x="739.5" y="511" class="cardBody" text-anchor="middle">representation</text>

    <rect x="822" y="410" width="130" height="145" rx="12" class="card"/>
    <text x="887" y="447" class="cardTitle" text-anchor="middle">Validation +</text>
    <text x="887" y="464" class="cardTitle" text-anchor="middle">Policy</text>
    <text x="887" y="488" class="cardBody" text-anchor="middle">Deterministic</text>
    <text x="887" y="504" class="cardBody" text-anchor="middle">validation and</text>
    <text x="887" y="520" class="cardBody" text-anchor="middle">policy checks</text>

    <path d="M952 355 C952 385 439 385 439 410" class="arrow"/>
    <path d="M507 482 H522" class="arrow"/><path d="M657 482 H672" class="arrow"/><path d="M807 482 H822" class="arrow"/>

    <rect x="372" y="595" width="580" height="145" rx="12" class="card"/>
    <text x="662" y="635" class="cardTitle" text-anchor="middle">Evaluation + Bounded Repair</text>
    <text x="662" y="660" class="cardBody" text-anchor="middle">Test requirements, inspect evidence, and revise only within bounded IR/configuration rules.</text>
    <text x="662" y="680" class="cardBody" text-anchor="middle">New revisions become explicit workflow versions instead of silently rewriting history.</text>
    <rect x="545" y="703" width="95" height="22" rx="11" class="chip"/><text x="592.5" y="714" class="chipText">EVALUATE</text>
    <rect x="650" y="703" width="95" height="22" rx="11" class="chip"/><text x="697.5" y="714" class="chipText">REPAIR</text>
    <path d="M887 555 V595" class="arrow"/>
  </g>

  <!-- EXECUTION -->
  <g filter="url(#shadow)">
    <rect x="1005" y="125" width="345" height="660" rx="14" class="plane"/>
    <rect x="1005" y="125" width="345" height="70" rx="14" class="head"/>
    <rect x="1005" y="165" width="345" height="30" class="head"/>
    <text x="1177.5" y="157" class="headText" text-anchor="middle">EXECUTION PLANE</text>
    <text x="1177.5" y="179" class="headSub" text-anchor="middle">Secure, policy-aware runtime execution</text>

    <rect x="1030" y="220" width="295" height="90" rx="12" class="cardStrong"/>
    <text x="1110" y="252" class="cardTitle">Runtime</text>
    <text x="1110" y="272" class="cardBody">Execute Workflow IR</text>
    <text x="1110" y="288" class="cardBody">with policy enforcement</text>
    <circle cx="1065" cy="266" r="22" fill="#0c5372"/>
    <path d="M1059 254 l14 12 -14 12 z" fill="#fff"/>

    <rect x="1030" y="335" width="295" height="160" rx="12" class="card"/>
    <text x="1177.5" y="370" class="cardTitle" text-anchor="middle">Policy-aware Tool Gateway</text>
    <text x="1177.5" y="392" class="cardBody" text-anchor="middle">Controlled access to external tools and services</text>
    <rect x="1055" y="420" width="245" height="55" rx="10" fill="#e8f8fc" stroke="#40bfe4" stroke-width="1.5"/>
    <text x="1177.5" y="440" class="cardTitle" text-anchor="middle">CAPABILITIES</text>
    <rect x="1068" y="448" width="52" height="20" rx="10" class="chip"/><text x="1094" y="458" class="chipText">Web</text>
    <rect x="1126" y="448" width="52" height="20" rx="10" class="chip"/><text x="1152" y="458" class="chipText">URL</text>
    <rect x="1184" y="448" width="65" height="20" rx="10" class="chip"/><text x="1216.5" y="458" class="chipText">GitHub</text>
    <rect x="1255" y="448" width="38" height="20" rx="10" class="chip"/><text x="1274" y="458" class="chipText">API</text>

    <rect x="1030" y="520" width="295" height="90" rx="12" class="card"/>
    <text x="1110" y="553" class="cardTitle">Human Approval</text>
    <text x="1110" y="574" class="cardBody">Approval for sensitive</text>
    <text x="1110" y="590" class="cardBody">side-effecting actions</text>
    <circle cx="1065" cy="566" r="20" fill="#0c5372"/>
    <circle cx="1065" cy="558" r="6" fill="#fff"/><path d="M1052 579 q13 -15 26 0" stroke="#fff" stroke-width="4" fill="none"/>

    <rect x="1030" y="635" width="295" height="105" rx="12" class="card"/>
    <text x="1110" y="670" class="cardTitle">Execution Trace + Output</text>
    <text x="1110" y="692" class="cardBody">Observable logs, artifacts</text>
    <text x="1110" y="708" class="cardBody">and terminal results</text>
    <rect x="1047" y="660" width="30" height="36" rx="5" fill="#0c5372"/>
    <path d="M1055 670 h14 M1055 678 h14 M1055 686 h11" stroke="#fff" stroke-width="2"/>
  </g>

  <path d="M1177.5 310 V335" class="arrow"/>
  <path d="M1177.5 495 V520" class="arrow"/>
  <path d="M1177.5 610 V635" class="arrow"/>
  <path d="M952 482 H1005" class="arrow"/>
  
  <!-- OUTPUT -->
  <g filter="url(#shadow)">
    <rect x="1380" y="125" width="375" height="660" rx="14" class="plane"/>
    <rect x="1380" y="125" width="375" height="70" rx="14" class="head"/>
    <rect x="1380" y="165" width="375" height="30" class="head"/>
    <text x="1567.5" y="157" class="headText" text-anchor="middle">OUTPUT</text>
    <text x="1567.5" y="179" class="headSub" text-anchor="middle">Observable system results</text>

    <rect x="1405" y="220" width="325" height="100" rx="12" class="cardStrong"/>
    <text x="1455" y="258" class="cardTitle">Completed Execution</text>
    <text x="1455" y="280" class="cardBody">Tasks executed successfully</text>
    <path d="M1420 295 h12 v-30 h-12 z M1438 295 h12 v-45 h-12 z M1456 295 h12 v-58 h-12 z" fill="#0c5372"/>

    <rect x="1405" y="350" width="325" height="100" rx="12" class="card"/>
    <text x="1455" y="388" class="cardTitle">Artifacts</text>
    <text x="1455" y="410" class="cardBody">Generated files, reports and data</text>
    <rect x="1420" y="377" width="22" height="30" rx="3" fill="#0c5372"/><path d="M1425 385 h12 M1425 392 h12 M1425 399 h8" stroke="#fff" stroke-width="2"/>

    <rect x="1405" y="480" width="325" height="100" rx="12" class="card"/>
    <text x="1455" y="518" class="cardTitle">Logs &amp; Trace</text>
    <text x="1455" y="540" class="cardBody">Observable and auditable execution history</text>
    <path d="M1420 553 h10 v-25 h-10 z M1435 553 h10 v-38 h-10 z M1450 553 h10 v-52 h-10 z" fill="#0c5372"/>

    <rect x="1405" y="610" width="325" height="100" rx="12" class="card"/>
    <text x="1455" y="648" class="cardTitle">Real-world Results</text>
    <text x="1455" y="670" class="cardBody">Delivered outcomes from the compiled system</text>
    <circle cx="1434" cy="660" r="20" fill="#0c5372"/><path d="M1424 660 l7 7 14 -16" stroke="#fff" stroke-width="4" fill="none"/>
  </g>

  <path d="M1325 265 H1380" class="arrow"/>
  <path d="M1567.5 320 V350" class="arrow"/>
  <path d="M1567.5 450 V480" class="arrow"/>
  <path d="M1567.5 580 V610" class="arrow"/>

  <!-- AWS INFRA -->
  <g filter="url(#shadow)">
    <rect x="45" y="815" width="1710" height="130" rx="14" class="infra"/>
    <text x="70" y="850" class="infraTitle">AWS INFRASTRUCTURE</text>
    <text x="320" y="850" class="infraSub">Scalable, secure and managed cloud foundation</text>

    <g>
      <rect x="62" y="868" width="190" height="60" rx="10" class="infraCard"/>
      <text x="78" y="893" class="infraName">API Gateway + Lambda</text>
      <text x="78" y="910" class="infraBody">Ingress + FastAPI control plane</text>
    </g>
    <g>
      <rect x="262" y="868" width="190" height="60" rx="10" class="infraCard"/>
      <text x="278" y="893" class="infraName">Cognito</text>
      <text x="278" y="910" class="infraBody">Authentication + workspace identity</text>
    </g>
    <g>
      <rect x="462" y="868" width="190" height="60" rx="10" class="infraCard"/>
      <text x="478" y="893" class="infraName">Amazon Bedrock</text>
      <text x="478" y="910" class="infraBody">Architecture + agent models</text>
    </g>
    <g>
      <rect x="662" y="868" width="190" height="60" rx="10" class="infraCard"/>
      <text x="678" y="893" class="infraName">Step Functions</text>
      <text x="678" y="910" class="infraBody">Durable Workflow IR execution</text>
    </g>
    <g>
      <rect x="862" y="868" width="190" height="60" rx="10" class="infraCard"/>
      <text x="878" y="893" class="infraName">DynamoDB</text>
      <text x="878" y="910" class="infraBody">Project state + approvals</text>
    </g>
    <g>
      <rect x="1062" y="868" width="190" height="60" rx="10" class="infraCard"/>
      <text x="1078" y="893" class="infraName">S3</text>
      <text x="1078" y="910" class="infraBody">Sources + artifacts + snapshots</text>
    </g>
    <g>
      <rect x="1262" y="868" width="190" height="60" rx="10" class="infraCard"/>
      <text x="1278" y="893" class="infraName">EventBridge</text>
      <text x="1278" y="910" class="infraBody">Scheduled + event triggers</text>
    </g>
    <g>
      <rect x="1462" y="868" width="273" height="60" rx="10" class="infraCard"/>
      <text x="1478" y="893" class="infraName">IAM + Service Permissions</text>
      <text x="1478" y="910" class="infraBody">Scoped roles and secure service access</text>
    </g>
  </g>

  <!-- infra dependency connectors -->
  <path d="M182 785 V815" class="dash"/><path d="M662 785 V815" class="dash"/>
  <path d="M1178 785 V815" class="dash"/><path d="M1568 785 V815" class="dash"/>
  <path d="M1168 815 V785" class="dash"/>
  <text x="182" y="805" class="label">API / CONTROL</text>
  <text x="662" y="805" class="label">PERSISTENCE</text>
  <text x="1178" y="805" class="label">MODEL + DURABLE EXECUTION</text>
  <text x="1568" y="805" class="label">STORAGE / EVENTS</text>

  <text x="55" y="980" class="foot">SPECLOOM</text>
  <text x="905" y="980" class="foot" text-anchor="middle">TURN ANY PROBLEM INTO A PRODUCTION-READY AGENTIC SYSTEM</text>
</svg>