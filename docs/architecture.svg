<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940" role="img" aria-labelledby="title desc">
  <title id="title">Specloom end-to-end architecture</title>
  <desc id="desc">Four aligned planes show the path from a user's problem through the Specloom control plane to runtime execution and AWS infrastructure.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity="0.24"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/></marker>
    <marker id="dottedArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <style>
      .bg{fill:#0b1020}
      .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .plane{fill:#0f172a;stroke:#334155;stroke-width:2}
      .planeTitle{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}
      .node{fill:#162033;stroke:#475569;stroke-width:1.5}
      .nodeStrong{fill:#102a43;stroke:#38bdf8;stroke-width:2}
      .nodeText{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#e5e7eb;text-anchor:middle;dominant-baseline:middle}
      .smallText{font:500 11px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;text-anchor:middle}
      .arrow{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}
      .dotted{fill:none;stroke:#94a3b8;stroke-width:2.2;stroke-dasharray:8 8;marker-end:url(#dottedArrow)}
      .label{font:600 11px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;text-anchor:middle}
    </style>
  </defs>

  <rect class="bg" width="1800" height="940" rx="28"/>
  <text x="55" y="55" class="title">Specloom — End-to-End Architecture</text>
  <text x="55" y="82" class="subtitle">Problem + context → Workflow IR → deterministic policy boundary → runtime → observable system.</text>

  <!-- EXPERIENCE -->
  <rect x="40" y="120" width="255" height="765" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="70" y="160" class="planeTitle">01 · Experience</text>
  <rect x="70" y="235" width="195" height="78" rx="14" class="nodeStrong"/><text x="167.5" y="269" class="nodeText">User</text><text x="167.5" y="291" class="smallText">goal + context</text>
  <rect x="70" y="365" width="195" height="92" rx="14" class="node"/><text x="167.5" y="406" class="nodeText">React / Vite Workspace</text><text x="167.5" y="428" class="smallText">build · system graph · tests</text>
  <rect x="70" y="510" width="195" height="92" rx="14" class="node"/><text x="167.5" y="551" class="nodeText">Operations</text><text x="167.5" y="573" class="smallText">deploy · approvals · runs</text>
  <path d="M167.5 313 L167.5 365" class="arrow"/>
  <path d="M167.5 457 L167.5 510" class="arrow"/>

  <!-- CONTROL -->
  <rect x="330" y="120" width="565" height="765" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="360" y="160" class="planeTitle">02 · Specloom Control Plane</text>
  <rect x="510" y="190" width="205" height="58" rx="14" class="node"/><text x="612.5" y="214" class="nodeText">FastAPI API</text><text x="612.5" y="236" class="smallText">control surface</text>
  <rect x="510" y="275" width="205" height="58" rx="14" class="node"/><text x="612.5" y="299" class="nodeText">Context Graph</text><text x="612.5" y="321" class="smallText">sources + facts + provenance</text>
  <rect x="510" y="360" width="205" height="58" rx="14" class="node"/><text x="612.5" y="384" class="nodeText">Gap Detection</text><text x="612.5" y="406" class="smallText">clarify missing intent</text>
  <rect x="510" y="445" width="205" height="58" rx="14" class="node"/><text x="612.5" y="469" class="nodeText">Problem Decomposition</text><text x="612.5" y="491" class="smallText">executable plan</text>
  <rect x="510" y="530" width="205" height="58" rx="14" class="node"/><text x="612.5" y="554" class="nodeText">Architect</text><text x="612.5" y="576" class="smallText">model-backed proposal</text>
  <rect x="510" y="615" width="205" height="58" rx="14" class="node"/><text x="612.5" y="639" class="nodeText">Universal Compiler</text><text x="612.5" y="661" class="smallText">SoftwareSpec + capabilities</text>
  <rect x="480" y="700" width="265" height="72" rx="14" class="nodeStrong"/><text x="612.5" y="731" class="nodeText">Workflow IR</text><text x="612.5" y="753" class="smallText">canonical execution graph</text>
  <rect x="480" y="790" width="265" height="66" rx="14" class="node"/><text x="612.5" y="818" class="nodeText">Validation + Evaluation + Repair</text><text x="612.5" y="840" class="smallText">policy + evidence + bounded revision</text>
  <path d="M612.5 248 L612.5 275" class="arrow"/>
  <path d="M612.5 333 L612.5 360" class="arrow"/>
  <path d="M612.5 418 L612.5 445" class="arrow"/>
  <path d="M612.5 503 L612.5 530" class="arrow"/>
  <path d="M612.5 588 L612.5 615" class="arrow"/>
  <path d="M612.5 673 L612.5 700" class="arrow"/>
  <path d="M612.5 772 L612.5 790" class="arrow"/>

  <!-- EXECUTION -->
  <rect x="930" y="120" width="350" height="765" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="960" y="160" class="planeTitle">03 · Execution Plane</text>
  <rect x="965" y="690" width="280" height="70" rx="14" class="nodeStrong"/><text x="1105" y="720" class="nodeText">Runtime</text><text x="1105" y="742" class="smallText">interprets validated Workflow IR</text>
  <rect x="965" y="790" width="135" height="62" rx="14" class="node"/><text x="1032.5" y="816" class="nodeText">Tool Gateway</text><text x="1032.5" y="838" class="smallText">policy boundary</text>
  <rect x="1115" y="790" width="130" height="62" rx="14" class="node"/><text x="1180" y="816" class="nodeText">Human Approval</text><text x="1180" y="838" class="smallText">protected writes</text>
  <rect x="965" y="870" width="135" height="0" rx="14" class="node"/><text x="1032.5" y="865" class="nodeText">Capabilities</text>
  <rect x="1115" y="870" width="130" height="0" rx="14" class="node"/><text x="1180" y="865" class="nodeText">Trace + Output</text>
  <rect x="965" y="845" width="135" height="40" rx="12" class="node"/>
  <text x="1032.5" y="865" class="nodeText">Capabilities</text>
  <rect x="1115" y="845" width="130" height="40" rx="12" class="node"/>
  <text x="1180" y="865" class="nodeText">Trace + Output</text>
  <path d="M1105 760 L1105 790" class="arrow"/>
  <path d="M1100 821 L1032.5 845" class="arrow"/>
  <path d="M1032.5 821 L1180 845" class="dotted"/><text x="1106.25" y="825" class="label">policy</text>
  <path d="M1245 821 L1180 845" class="arrow"/>
  
  <!-- AWS -->
  <rect x="1315" y="120" width="445" height="765" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="1345" y="160" class="planeTitle">04 · AWS Infrastructure</text>
  <rect x="1350" y="205" width="375" height="64" rx="14" class="node"/><text x="1537.5" y="232" class="nodeText">API Gateway + Lambda</text><text x="1537.5" y="254" class="smallText">public ingress → FastAPI</text>
  <rect x="1350" y="295" width="175" height="64" rx="14" class="node"/><text x="1437.5" y="322" class="nodeText">Cognito</text><text x="1437.5" y="344" class="smallText">identity</text>
  <rect x="1550" y="295" width="175" height="64" rx="14" class="node"/><text x="1637.5" y="322" class="nodeText">Bedrock</text><text x="1637.5" y="344" class="smallText">architect + agent nodes</text>
  <rect x="1350" y="385" width="175" height="64" rx="14" class="node"/><text x="1437.5" y="412" class="nodeText">Step Functions</text><text x="1437.5" y="434" class="smallText">durable workflows</text>
  <rect x="1550" y="385" width="175" height="64" rx="14" class="node"/><text x="1637.5" y="412" class="nodeText">DynamoDB</text><text x="1637.5" y="434" class="smallText">project + approvals</text>
  <rect x="1350" y="475" width="175" height="64" rx="14" class="node"/><text x="1437.5" y="502" class="nodeText">S3</text><text x="1437.5" y="524" class="smallText">sources + artifacts</text>
  <rect x="1550" y="475" width="175" height="64" rx="14" class="node"/><text x="1637.5" y="502" class="nodeText">EventBridge</text><text x="1637.5" y="524" class="smallText">scheduled triggers</text>
  <rect x="1350" y="600" width="375" height="100" rx="14" class="node"/><text x="1537.5" y="645" class="nodeText">Durable execution</text><text x="1537.5" y="667" class="smallText">project state machines are derived from Workflow IR</text>
  <rect x="1350" y="735" width="375" height="100" rx="14" class="node"/><text x="1537.5" y="780" class="nodeText">IAM + service permissions</text><text x="1537.5" y="802" class="smallText">scoped roles for data, models, orchestration, and deployment</text>

  <path d="M1437.5 269 L1437.5 295" class="arrow"/>
  <path d="M1637.5 269 L1637.5 295" class="arrow"/>
  <path d="M1437.5 359 L1437.5 385" class="arrow"/>
  <path d="M1637.5 359 L1637.5 385" class="arrow"/>
  <path d="M1437.5 449 L1437.5 475" class="arrow"/>
  <path d="M1637.5 449 L1637.5 475" class="arrow"/>

  <!-- PLANE LINKS -->
  <path d="M265 274 L510 219" class="dotted"/><text x="387.5" y="238.5" class="label">API</text>
  <path d="M745 823 L930 725" class="dotted"/><text x="837.5" y="766" class="label">validated IR</text>
  <path d="M1245 725 L1350 237" class="dotted"/><text x="1297.5" y="473" class="label">runtime</text>
  <path d="M1245 725 L1637.5 327" class="dotted"/><text x="1441.25" y="518" class="label">model</text>
  <path d="M1245 725 L1437.5 417" class="dotted"/><text x="1341.25" y="563" class="label">durable</text>
  <path d="M715 219 L1350 237" class="dotted"/><text x="1032.5" y="220" class="label">persistence</text>
  
  <text x="55" y="915" class="subtitle">Solid arrows = primary flow. Dashed arrows = infrastructure or service dependencies.</text>
</svg>