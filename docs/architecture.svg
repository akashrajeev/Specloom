<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Specloom end-to-end architecture</title>
  <desc id="desc">Left-to-right architecture showing the user interface, Specloom control plane, execution plane, and AWS infrastructure.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="dottedArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .bg{fill:#0b1020}
      .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .plane{fill:#0f172a;stroke:#334155;stroke-width:2}
      .planeTitle{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}
      .node{fill:#162033;stroke:#475569;stroke-width:1.5}
      .nodeStrong{fill:#102a43;stroke:#38bdf8;stroke-width:2}
      .nodeText{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#e5e7eb;text-anchor:middle;dominant-baseline:middle}
      .smallText{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;text-anchor:middle}
      .arrow{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}
      .dotted{fill:none;stroke:#94a3b8;stroke-width:2.2;stroke-dasharray:8 8;marker-end:url(#dottedArrow)}
      .label{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
    </style>
  </defs>

  <rect class="bg" width="1800" height="980" rx="28"/>
  <text x="80" y="70" class="title">Specloom — End-to-End Architecture</text>
  <text x="80" y="100" class="subtitle">Goal and context become a validated Workflow IR, then execute through policy-controlled capabilities.</text>

  <!-- Experience -->
  <rect x="55" y="150" width="265" height="720" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="85" y="190" class="planeTitle">01 · Experience</text>
  <rect x="85" y="245" width="205" height="80" rx="14" class="nodeStrong"/>
  <text x="187.5" y="280" class="nodeText">User</text>
  <text x="187.5" y="302" class="smallText">problem + context</text>
  <rect x="85" y="390" width="205" height="110" rx="14" class="node"/>
  <text x="187.5" y="435" class="nodeText">React / Vite</text>
  <text x="187.5" y="458" class="smallText">build · graph · tests</text>
  <text x="187.5" y="476" class="smallText">deploy · runs · provenance</text>

  <!-- Control -->
  <rect x="355" y="150" width="610" height="720" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="385" y="190" class="planeTitle">02 · Specloom Control Plane</text>

  <rect x="390" y="235" width="245" height="74" rx="13" class="node"/>
  <text x="512.5" y="272" class="nodeText">FastAPI API</text>

  <rect x="665" y="235" width="265" height="74" rx="13" class="node"/>
  <text x="797.5" y="272" class="nodeText">Context Graph</text>

  <rect x="390" y="340" width="245" height="74" rx="13" class="node"/>
  <text x="512.5" y="377" class="nodeText">Gap Detection</text>

  <rect x="665" y="340" width="265" height="74" rx="13" class="node"/>
  <text x="797.5" y="377" class="nodeText">Problem Decomposition</text>

  <rect x="390" y="445" width="245" height="74" rx="13" class="node"/>
  <text x="512.5" y="482" class="nodeText">Architect</text>

  <rect x="665" y="445" width="265" height="74" rx="13" class="node"/>
  <text x="797.5" y="482" class="nodeText">Universal Compiler</text>

  <rect x="390" y="550" width="245" height="74" rx="13" class="nodeStrong"/>
  <text x="512.5" y="587" class="nodeText">Workflow IR</text>

  <rect x="665" y="550" width="265" height="74" rx="13" class="node"/>
  <text x="797.5" y="587" class="nodeText">Validation + Policy</text>

  <rect x="390" y="660" width="540" height="125" rx="14" class="node"/>
  <text x="660" y="700" class="nodeText">Evaluation + Bounded Repair</text>
  <text x="660" y="726" class="smallText">requirements · constraints · capabilities · outputs</text>
  <text x="660" y="748" class="smallText">repair produces a new workflow version</text>

  <!-- Control arrows -->
  <path d="M290 435 C330 435 330 272 390 272" class="arrow"/>
  <path d="M635 272 L665 272" class="arrow"/>
  <path d="M797.5 309 L797.5 340" class="arrow"/>
  <path d="M635 377 L665 377" class="arrow"/>
  <path d="M797.5 414 L797.5 445" class="arrow"/>
  <path d="M635 482 L665 482" class="arrow"/>
  <path d="M797.5 519 L797.5 550" class="arrow"/>
  <path d="M635 587 L665 587" class="arrow"/>
  <path d="M797.5 624 L797.5 660" class="arrow"/>
  <path d="M660 785 C660 820 512.5 820 512.5 624" class="dotted"/>
  
  <!-- Execution -->
  <rect x="1000" y="150" width="340" height="720" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="1030" y="190" class="planeTitle">03 · Execution Plane</text>

  <rect x="1035" y="240" width="270" height="78" rx="13" class="nodeStrong"/>
  <text x="1170" y="279" class="nodeText">Runtime</text>

  <rect x="1035" y="360" width="270" height="78" rx="13" class="node"/>
  <text x="1170" y="399" class="nodeText">Policy-aware Tool Gateway</text>

  <rect x="1035" y="480" width="270" height="78" rx="13" class="node"/>
  <text x="1170" y="519" class="nodeText">Capabilities</text>

  <rect x="1035" y="600" width="270" height="78" rx="13" class="node"/>
  <text x="1170" y="631" class="nodeText">Human Approval</text>
  <text x="1170" y="652" class="smallText">when a write requires review</text>

  <rect x="1035" y="720" width="270" height="78" rx="13" class="node"/>
  <text x="1170" y="759" class="nodeText">Execution Trace + Output</text>

  <path d="M930 587 L1000 279" class="arrow"/>
  <path d="M1170 318 L1170 360" class="arrow"/>
  <path d="M1170 438 L1170 480" class="arrow"/>
  <path d="M1170 558 L1170 600" class="arrow"/>
  <path d="M1170 678 L1170 720" class="arrow"/>

  <!-- AWS -->
  <rect x="1375" y="150" width="370" height="720" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="1405" y="190" class="planeTitle">04 · AWS Infrastructure</text>

  <rect x="1410" y="230" width="300" height="68" rx="13" class="node"/>
  <text x="1560" y="264" class="nodeText">API Gateway + Lambda</text>

  <rect x="1410" y="330" width="142" height="68" rx="13" class="node"/>
  <text x="1481" y="364" class="nodeText">Cognito</text>
  <rect x="1568" y="330" width="142" height="68" rx="13" class="node"/>
  <text x="1639" y="364" class="nodeText">Bedrock</text>

  <rect x="1410" y="430" width="142" height="68" rx="13" class="node"/>
  <text x="1481" y="464" class="nodeText">Step Functions</text>
  <rect x="1568" y="430" width="142" height="68" rx="13" class="node"/>
  <text x="1639" y="464" class="nodeText">DynamoDB</text>

  <rect x="1410" y="530" width="142" height="68" rx="13" class="node"/>
  <text x="1481" y="564" class="nodeText">S3</text>
  <rect x="1568" y="530" width="142" height="68" rx="13" class="node"/>
  <text x="1639" y="564" class="nodeText">EventBridge</text>

  <rect x="1410" y="650" width="300" height="130" rx="14" class="node"/>
  <text x="1560" y="692" class="nodeText">Durable project runtime</text>
  <text x="1560" y="720" class="smallText">Standard Step Functions</text>
  <text x="1560" y="744" class="smallText">state machines are derived from Workflow IR</text>

  <!-- AWS arrows -->
  <path d="M1340 279 C1370 279 1380 264 1410 264" class="dotted"/>
  <path d="M1340 399 C1370 399 1380 464 1410 464" class="dotted"/>
  <path d="M1340 759 C1380 759 1410 715 1410 715" class="dotted"/>
  <path d="M1551 364 L1568 364" class="arrow"/>
  <path d="M1481 398 L1481 430" class="arrow"/>
  <path d="M1639 398 L1639 430" class="arrow"/>
  <path d="M1481 498 L1481 530" class="arrow"/>
  <path d="M1639 498 L1639 530" class="arrow"/>

  <text x="80" y="920" class="subtitle">Primary path: intent → context → architecture → Workflow IR → validation → runtime → observable result.</text>
</svg>