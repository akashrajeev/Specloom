<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920" role="img" aria-labelledby="title desc">
  <title id="title">Specloom end-to-end architecture</title>
  <desc id="desc">Four aligned planes show the path from a problem through the Specloom control plane to runtime execution, with AWS services as the infrastructure layer.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity="0.24"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/></marker>
    <marker id="dottedArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <style>
      .bg{fill:#0b1020}
      .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .plane{fill:#0f172a;stroke:#334155;stroke-width:2}
      .planeTitle{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}
      .node{fill:#162033;stroke:#475569;stroke-width:1.5}
      .nodeStrong{fill:#102a43;stroke:#38bdf8;stroke-width:2}
      .nodeText{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#e5e7eb;text-anchor:middle;dominant-baseline:middle}
      .smallText{font:500 11px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;text-anchor:middle}
      .arrow{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}
      .dotted{fill:none;stroke:#94a3b8;stroke-width:2.2;stroke-dasharray:8 8;marker-end:url(#dottedArrow)}
      .label{font:600 11px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;text-anchor:middle}
    </style>
  </defs>

  <rect class="bg" width="1800" height="920" rx="28"/>
  <text x="55" y="55" class="title">Specloom — End-to-End Architecture</text>
  <text x="55" y="82" class="subtitle">Problem + context → Workflow IR → deterministic policy boundary → runtime → observable output.</text>

  <!-- EXPERIENCE -->
  <rect x="40" y="120" width="255" height="730" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="70" y="160" class="planeTitle">01 · Experience</text>
  <rect x="70" y="235" width="195" height="78" rx="14" class="nodeStrong"/><text x="167.5" y="269" class="nodeText">User</text><text x="167.5" y="291" class="smallText">goal + context</text>
  <rect x="70" y="365" width="195" height="92" rx="14" class="node"/><text x="167.5" y="406" class="nodeText">React / Vite Workspace</text><text x="167.5" y="428" class="smallText">build · system graph · tests</text>
  <rect x="70" y="515" width="195" height="92" rx="14" class="node"/><text x="167.5" y="556" class="nodeText">Operations</text><text x="167.5" y="578" class="smallText">deploy · approvals · runs</text>
  <path d="M167.5 313 L167.5 365" class="arrow"/>
  <path d="M167.5 457 L167.5 515" class="arrow"/>

  <!-- CONTROL -->
  <rect x="330" y="120" width="565" height="730" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="360" y="160" class="planeTitle">02 · Specloom Control Plane</text>
  <rect x="510" y="185" width="205" height="55" rx="14" class="node"/><text x="612.5" y="207.5" class="nodeText">FastAPI API</text><text x="612.5" y="229.5" class="smallText">control surface</text>
  <rect x="510" y="255" width="205" height="55" rx="14" class="node"/><text x="612.5" y="277.5" class="nodeText">Context Graph</text><text x="612.5" y="299.5" class="smallText">sources + facts + provenance</text>
  <rect x="510" y="325" width="205" height="55" rx="14" class="node"/><text x="612.5" y="347.5" class="nodeText">Gap Detection</text><text x="612.5" y="369.5" class="smallText">clarify missing intent</text>
  <rect x="510" y="395" width="205" height="55" rx="14" class="node"/><text x="612.5" y="417.5" class="nodeText">Problem Decomposition</text><text x="612.5" y="439.5" class="smallText">executable plan</text>
  <rect x="510" y="465" width="205" height="55" rx="14" class="node"/><text x="612.5" y="487.5" class="nodeText">Architect</text><text x="612.5" y="509.5" class="smallText">model-backed proposal</text>
  <rect x="510" y="535" width="205" height="55" rx="14" class="node"/><text x="612.5" y="557.5" class="nodeText">Universal Compiler</text><text x="612.5" y="579.5" class="smallText">SoftwareSpec + capabilities</text>
  <rect x="480" y="605" width="265" height="62" rx="14" class="nodeStrong"/><text x="612.5" y="631" class="nodeText">Workflow IR</text><text x="612.5" y="653" class="smallText">canonical execution graph</text>
  <rect x="480" y="685" width="265" height="70" rx="14" class="node"/><text x="612.5" y="715" class="nodeText">Validation + Evaluation + Repair</text><text x="612.5" y="737" class="smallText">policy + evidence + bounded revision</text>
  <path d="M612.5 240 L612.5 255" class="arrow"/>
  <path d="M612.5 310 L612.5 325" class="arrow"/>
  <path d="M612.5 380 L612.5 395" class="arrow"/>
  <path d="M612.5 450 L612.5 465" class="arrow"/>
  <path d="M612.5 520 L612.5 535" class="arrow"/>
  <path d="M612.5 590 L612.5 605" class="arrow"/>
  <path d="M612.5 667 L612.5 685" class="arrow"/>

  <!-- EXECUTION -->
  <rect x="930" y="120" width="350" height="730" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="960" y="160" class="planeTitle">03 · Execution Plane</text>
  <rect x="965" y="685" width="280" height="70" rx="14" class="nodeStrong"/><text x="1105" y="715" class="nodeText">Runtime</text><text x="1105" y="737" class="smallText">interprets validated Workflow IR</text>
  <rect x="965" y="785" width="135" height="58" rx="14" class="node"/><text x="1032.5" y="809" class="nodeText">Tool Gateway</text><text x="1032.5" y="831" class="smallText">policy boundary</text>
  <rect x="1115" y="785" width="130" height="58" rx="14" class="node"/><text x="1180" y="809" class="nodeText">Human Approval</text><text x="1180" y="831" class="smallText">protected writes</text>
  <rect x="965" y="825" width="135" height="0" rx="14" class="node"/><text x="1032.5" y="820" class="nodeText"></text>
  <rect x="965" y="830" width="135" height="20" rx="10" fill="#162033" opacity="0"/>
  <rect x="1115" y="830" width="130" height="20" rx="10" fill="#162033" opacity="0"/>
  <text x="1032.5" y="842" class="smallText">capabilities</text>
  <text x="1180" y="842" class="smallText">trace + output</text>
  <path d="M1105 755 L1105 785" class="arrow"/>
  <path d="M1032.5 843 L1032.5 830" class="arrow"/>
  <path d="M1032.5 843 L1180 830" class="dotted"/><text x="1106.25" y="828.5" class="label">events</text>
  <path d="M1180 843 L1180 830" class="arrow"/>

  <!-- AWS -->
  <rect x="1315" y="120" width="445" height="730" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="1345" y="160" class="planeTitle">04 · AWS Infrastructure</text>
  <rect x="1350" y="195" width="375" height="62" rx="14" class="node"/><text x="1537.5" y="221" class="nodeText">API Gateway + Lambda</text><text x="1537.5" y="243" class="smallText">public ingress → FastAPI</text>
  <rect x="1350" y="285" width="175" height="62" rx="14" class="node"/><text x="1437.5" y="311" class="nodeText">Cognito</text><text x="1437.5" y="333" class="smallText">identity</text>
  <rect x="1550" y="285" width="175" height="62" rx="14" class="node"/><text x="1637.5" y="311" class="nodeText">Bedrock</text><text x="1637.5" y="333" class="smallText">architect + agent nodes</text>
  <rect x="1350" y="375" width="175" height="62" rx="14" class="node"/><text x="1437.5" y="401" class="nodeText">Step Functions</text><text x="1437.5" y="423" class="smallText">durable workflows</text>
  <rect x="1550" y="375" width="175" height="62" rx="14" class="node"/><text x="1637.5" y="401" class="nodeText">DynamoDB</text><text x="1637.5" y="423" class="smallText">project + approvals</text>
  <rect x="1350" y="465" width="175" height="62" rx="14" class="node"/><text x="1437.5" y="491" class="nodeText">S3</text><text x="1437.5" y="513" class="smallText">sources + artifacts</text>
  <rect x="1550" y="465" width="175" height="62" rx="14" class="node"/><text x="1637.5" y="491" class="nodeText">EventBridge</text><text x="1637.5" y="513" class="smallText">scheduled triggers</text>
  <rect x="1350" y="600" width="375" height="82" rx="14" class="node"/><text x="1537.5" y="636" class="nodeText">Durable Runtime</text><text x="1537.5" y="658" class="smallText">state machines derived from Workflow IR</text>
  <rect x="1350" y="715" width="375" height="95" rx="14" class="node"/><text x="1537.5" y="757.5" class="nodeText">IAM + Service Permissions</text><text x="1537.5" y="779.5" class="smallText">scoped access for data, models, orchestration, and deployment</text>

  <!-- Primary plane transition -->
  <path d="M745 720 L965 720" class="arrow"/>
  <text x="855" y="706" class="label">validated IR</text>

  <!-- Only the most important cross-plane dependency lines -->
  <path d="M715 212.5 L1350 226" class="dotted"/><text x="1032.5" y="211.25" class="label">HTTP ingress</text>
  <path d="M1245 720 L1550 316" class="dotted"/><text x="1397.5" y="510" class="label">model</text>
  <path d="M1245 720 L1437.5 406" class="dotted"/><text x="1341.25" y="555" class="label">durable</text>
  
  <text x="55" y="885" class="subtitle">Solid arrows = primary flow. Dashed arrows = service or infrastructure dependencies.</text>
</svg>