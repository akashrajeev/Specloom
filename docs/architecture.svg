<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="title desc">
  <title id="title">Specloom end-to-end architecture</title>
  <desc id="desc">A clean four-plane architecture for Specloom: experience, control plane, execution plane, and AWS infrastructure.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="dottedArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .bg{fill:#0b1020}
      .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .plane{fill:#0f172a;stroke:#334155;stroke-width:2}
      .planeTitle{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}
      .node{fill:#162033;stroke:#475569;stroke-width:1.5}
      .nodeStrong{fill:#102a43;stroke:#38bdf8;stroke-width:2}
      .nodeText{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#e5e7eb;text-anchor:middle;dominant-baseline:middle}
      .smallText{font:500 11px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;text-anchor:middle}
      .arrow{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}
      .dotted{fill:none;stroke:#94a3b8;stroke-width:2.2;stroke-dasharray:8 8;marker-end:url(#dottedArrow)}
      .label{font:600 11px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;text-anchor:middle}
    </style>
  </defs>

  <rect class="bg" width="1800" height="960" rx="28"/>
  <text x="60" y="55" class="title">Specloom — End-to-End Architecture</text>
  <text x="60" y="82" class="subtitle">Problem + context → compiled Workflow IR → policy-controlled execution → observable output.</text>

  <rect x="45" y="120" width="255" height="790" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="75" y="160" class="planeTitle">01 · Experience</text>
  <rect x="75" y="235" width="195" height="78" rx="14" class="nodeStrong"/><text x="172.5" y="269" class="nodeText">User</text><text x="172.5" y="291" class="smallText">goal + context</text>
  <rect x="75" y="390" width="195" height="108" rx="14" class="node"/><text x="172.5" y="439" class="nodeText">React / Vite Workspace</text><text x="172.5" y="461" class="smallText">build · graph · tests</text>
  <rect x="75" y="560" width="195" height="108" rx="14" class="node"/><text x="172.5" y="609" class="nodeText">Operations UI</text><text x="172.5" y="631" class="smallText">deploy · approvals · runs</text>
  <path d="M172.5 313 L172.5 390" class="arrow"/>
  <path d="M172.5 498 L172.5 560" class="arrow"/>

  <rect x="335" y="120" width="545" height="790" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="365" y="160" class="planeTitle">02 · Specloom Control Plane</text>
  <rect x="505" y="195" width="205" height="58" rx="14" class="node"/><text x="607.5" y="219" class="nodeText">FastAPI API</text><text x="607.5" y="241" class="smallText">control surface</text>
  <rect x="505" y="275" width="205" height="58" rx="14" class="node"/><text x="607.5" y="299" class="nodeText">Context Graph</text><text x="607.5" y="321" class="smallText">sources + facts + provenance</text>
  <rect x="505" y="355" width="205" height="58" rx="14" class="node"/><text x="607.5" y="379" class="nodeText">Gap Detection</text><text x="607.5" y="401" class="smallText">clarify missing intent</text>
  <rect x="505" y="435" width="205" height="58" rx="14" class="node"/><text x="607.5" y="459" class="nodeText">Problem Decomposition</text><text x="607.5" y="481" class="smallText">executable plan</text>
  <rect x="505" y="515" width="205" height="58" rx="14" class="node"/><text x="607.5" y="539" class="nodeText">Architect</text><text x="607.5" y="561" class="smallText">model-backed proposal</text>
  <rect x="505" y="595" width="205" height="58" rx="14" class="node"/><text x="607.5" y="619" class="nodeText">Universal Compiler</text><text x="607.5" y="641" class="smallText">SoftwareSpec + capabilities</text>
  <rect x="505" y="675" width="205" height="58" rx="14" class="nodeStrong"/><text x="607.5" y="699" class="nodeText">Workflow IR</text><text x="607.5" y="721" class="smallText">canonical execution graph</text>
  <rect x="505" y="755" width="205" height="58" rx="14" class="node"/><text x="607.5" y="779" class="nodeText">Validation + Policy</text><text x="607.5" y="801" class="smallText">structure + permissions</text>
  <rect x="505" y="835" width="205" height="58" rx="14" class="node"/><text x="607.5" y="859" class="nodeText">Evaluation + Repair</text><text x="607.5" y="881" class="smallText">evidence + bounded revision</text>
  <path d="M607.5 253 L607.5 275" class="arrow"/>
  <path d="M607.5 333 L607.5 355" class="arrow"/>
  <path d="M607.5 413 L607.5 435" class="arrow"/>
  <path d="M607.5 493 L607.5 515" class="arrow"/>
  <path d="M607.5 573 L607.5 595" class="arrow"/>
  <path d="M607.5 653 L607.5 675" class="arrow"/>
  <path d="M607.5 733 L607.5 755" class="arrow"/>
  <path d="M607.5 813 L607.5 835" class="arrow"/>

  <rect x="915" y="120" width="335" height="790" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="945" y="160" class="planeTitle">03 · Execution Plane</text>
  <rect x="950" y="225" width="265" height="72" rx="14" class="nodeStrong"/><text x="1082.5" y="256" class="nodeText">Runtime</text><text x="1082.5" y="278" class="smallText">Workflow IR interpreter</text>
  <rect x="950" y="345" width="265" height="72" rx="14" class="node"/><text x="1082.5" y="376" class="nodeText">Policy-aware Tool Gateway</text><text x="1082.5" y="398" class="smallText">authorization boundary</text>
  <rect x="950" y="465" width="265" height="72" rx="14" class="node"/><text x="1082.5" y="496" class="nodeText">Capabilities</text><text x="1082.5" y="518" class="smallText">web · URL · GitHub · API · MCP</text>
  <rect x="950" y="585" width="265" height="72" rx="14" class="node"/><text x="1082.5" y="616" class="nodeText">Human Approval</text><text x="1082.5" y="638" class="smallText">review before protected writes</text>
  <rect x="950" y="705" width="265" height="92" rx="14" class="node"/><text x="1082.5" y="746" class="nodeText">Trace + Output</text><text x="1082.5" y="768" class="smallText">events · status · terminal result</text>
  <path d="M1082.5 297 L1082.5 345" class="arrow"/>
  <path d="M1082.5 417 L1082.5 465" class="arrow"/>
  <path d="M1082.5 537 L1082.5 585" class="arrow"/>
  <path d="M1082.5 657 L1082.5 705" class="arrow"/>

  <rect x="1285" y="120" width="470" height="790" rx="20" class="plane" filter="url(#shadow)"/>
  <text x="1315" y="160" class="planeTitle">04 · AWS Infrastructure</text>
  <rect x="1320" y="210" width="400" height="66" rx="14" class="node"/><text x="1520" y="238" class="nodeText">API Gateway + Lambda</text><text x="1520" y="260" class="smallText">public ingress → FastAPI</text>
  <rect x="1320" y="305" width="190" height="66" rx="14" class="node"/><text x="1415" y="333" class="nodeText">Cognito</text><text x="1415" y="355" class="smallText">identity</text>
  <rect x="1530" y="305" width="190" height="66" rx="14" class="node"/><text x="1625" y="333" class="nodeText">Bedrock</text><text x="1625" y="355" class="smallText">architecture + agents</text>
  <rect x="1320" y="400" width="190" height="66" rx="14" class="node"/><text x="1415" y="428" class="nodeText">Step Functions</text><text x="1415" y="450" class="smallText">durable workflows</text>
  <rect x="1530" y="400" width="190" height="66" rx="14" class="node"/><text x="1625" y="428" class="nodeText">DynamoDB</text><text x="1625" y="450" class="smallText">project + approvals</text>
  <rect x="1320" y="495" width="190" height="66" rx="14" class="node"/><text x="1415" y="523" class="nodeText">S3</text><text x="1415" y="545" class="smallText">sources + artifacts</text>
  <rect x="1530" y="495" width="190" height="66" rx="14" class="node"/><text x="1625" y="523" class="nodeText">EventBridge</text><text x="1625" y="545" class="smallText">scheduled triggers</text>
  <rect x="1320" y="610" width="400" height="105" rx="14" class="node"/><text x="1520" y="657.5" class="nodeText">Durable Runtime</text><text x="1520" y="679.5" class="smallText">Standard Step Functions state machines are derived from Workflow IR</text>
  <rect x="1320" y="750" width="400" height="105" rx="14" class="node"/><text x="1520" y="797.5" class="nodeText">IAM + Service Permissions</text><text x="1520" y="819.5" class="smallText">scoped service access and execution roles</text>
  <path d="M1415 276 L1415 305" class="arrow"/>
  <path d="M1625 276 L1625 305" class="arrow"/>
  <path d="M1415 371 L1415 400" class="arrow"/>
  <path d="M1625 371 L1625 400" class="arrow"/>
  <path d="M1415 466 L1415 495" class="arrow"/>
  <path d="M1625 466 L1625 495" class="arrow"/>

  <path d="M270 274 L505 224" class="dotted"/><text x="387.5" y="241" class="label">API</text>
  <path d="M710 784 L950 261" class="dotted"/><text x="830" y="514.5" class="label">validated IR</text>
  <path d="M1250 261 L1320 243" class="dotted"/><text x="1285" y="244" class="label">runtime</text>
  <path d="M1250 381 L1530 338" class="dotted"/><text x="1390" y="351.5" class="label">model</text>
  <path d="M1250 381 L1415 433" class="dotted"/><text x="1332.5" y="399" class="label">durable</text>
  <path d="M710 224 L1320 243" class="dotted"/><text x="1015" y="225.5" class="label">state</text>
  <text x="60" y="938" class="subtitle">Solid arrows = primary flow. Dashed arrows = infrastructure or service dependencies.</text>
</svg>